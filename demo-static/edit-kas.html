```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Kas - Kaskelas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <main class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border-t-8 border-yellow-500">
        <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">✏️ Edit Data Kas</h1>
        <p class="text-center text-gray-500 text-sm mb-6">Perbarui tanggal atau nominal pembayaran.</p>

        <form id="form" class="space-y-4">
            <div>
                <label for="nama" class="block text-sm font-medium text-gray-700">Nama Siswa</label>
                <input id="nama" type="text" readonly
                    class="w-full border bg-gray-100 rounded-lg px-4 py-2 mt-1 text-gray-500">
            </div>
            <div>
                <label for="tanggal" class="block text-sm font-medium text-gray-700">Tanggal Bayar</label>
                <input id="tanggal" type="date" required
                    class="w-full border rounded-lg px-4 py-2 mt-1 focus:ring-2 focus:ring-yellow-400 outline-none">
            </div>
            <div>
                <label for="jumlah" class="block text-sm font-medium text-gray-700">Nominal (Rp)</label>
                <input id="jumlah" type="number" min="1" required
                    class="w-full border rounded-lg px-4 py-2 mt-1 focus:ring-2 focus:ring-yellow-400 outline-none">
            </div>
            <button type="submit"
                class="w-full bg-yellow-500 text-white py-2 rounded-lg font-bold hover:bg-yellow-600 transition">
                Simpan Perubahan
            </button>
        </form>

        <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><span class="w-full border-t"></span></div>
            <div class="relative flex justify-center text-xs uppercase">
                <span class="bg-white px-2 text-gray-400">Tindakan Lain</span>
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <button id="hapus" type="button"
                class="w-full bg-white border border-red-500 text-red-500 py-2 rounded-lg font-bold hover:bg-red-50">
                🗑️ Hapus Transaksi
            </button>
            <a href="kas.html"
                class="w-full bg-gray-200 text-gray-700 py-2 rounded-lg font-bold text-center hover:bg-gray-300">
                Batal / Kembali
            </a>
        </div>
        <p class="text-xs text-gray-400 mt-5 text-center">Mode demo — bukan transaksi database asli.</p>
    </main>

<script>
const KEY = "kaskelas-demo-v1";
const params = new URLSearchParams(location.search);
const id = Number(params.get("id"));

let data;
try {
    data = JSON.parse(localStorage.getItem(KEY));
} catch {
    data = null;
}

const form = document.getElementById("form");
const nama = document.getElementById("nama");
const tanggal = document.getElementById("tanggal");
const jumlah = document.getElementById("jumlah");

const item = data?.kas?.find(k => k.id === id);

function namaSiswa(idSiswa) {
    const siswa = [
        { id: 1, nama: "Contoh Siswa 1" },
        { id: 2, nama: "Contoh Siswa 2" },
        { id: 3, nama: "Contoh Siswa 3" },
        { id: 4, nama: "Contoh Siswa 4" },
        { id: 5, nama: "Contoh Siswa 5" }
    ];
    return siswa.find(s => s.id === idSiswa)?.nama || "Siswa demo";
}

if (!item) {
    form.classList.add("hidden");
    document.getElementById("hapus").classList.add("hidden");
    const pesan = document.createElement("p");
    pesan.className = "text-red-600 text-center";
    pesan.textContent = "Data pembayaran demo tidak ditemukan. Kembali ke halaman kas.";
    form.before(pesan);
} else {
    nama.value = namaSiswa(item.siswaId);
    tanggal.value = item.tanggal;
    jumlah.value = item.jumlah;
}

form.addEventListener("submit", event => {
    event.preventDefault();
    if (!data || !item) return;

    const nominal = Number(jumlah.value);
    if (!tanggal.value || !Number.isFinite(nominal) || nominal <= 0) {
        alert("Periksa kembali data pembayaran.");
        return;
    }

    item.tanggal = tanggal.value;
    item.jumlah = nominal;
    localStorage.setItem(KEY, JSON.stringify(data));
    alert("Perubahan pembayaran demo berhasil disimpan.");
    location.href = "kas.html";
});

document.getElementById("hapus").addEventListener("click", () => {
    if (!data || !item) return;
    if (!confirm("Yakin ingin menghapus transaksi demo ini?")) return;

    data.kas = data.kas.filter(k => k.id !== id);
    localStorage.setItem(KEY, JSON.stringify(data));
    alert("Transaksi demo berhasil dihapus.");
    location.href = "kas.html";
});
</script>
</body>
</html>
```
